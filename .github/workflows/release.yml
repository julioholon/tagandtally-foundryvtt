name: Release

on:
  push:
    tags: ["v*"]
  # Release from the Actions tab: Run workflow, type the version (X.Y.Z). The tag vX.Y.Z is
  # created on the selected branch (normally main), so no local git is needed.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (system.json on the branch should already say it)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Derive version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Version must look like 1.2.3"; exit 1; fi
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then echo "Tag v$VERSION already exists"; exit 1; fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Stamp system.json
        run: |
          python3 - "${{ steps.version.outputs.version }}" <<'PY'
          import json, sys
          version = sys.argv[1]
          with open("system.json") as f:
              data = json.load(f)
          repo = "https://github.com/${{ github.repository }}"
          data["version"] = version
          data["manifest"] = f"{repo}/releases/latest/download/system.json"
          data["download"] = f"{repo}/releases/download/v{version}/tagandtally.zip"
          with open("system.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY

      - name: Build zip
        run: |
          zip -r tagandtally.zip \
            system.json tagandtally.mjs module templates styles lang data assets \
            README.md LICENSE.md CHANGELOG.md \
            -x "*.DS_Store"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            system.json
            tagandtally.zip
